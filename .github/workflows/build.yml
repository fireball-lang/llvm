name: Build and Release LLVM Tools & Runtime

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM Version'
        required: true

env:
  LLVM_VERSION: ${{ github.event.inputs.llvm_version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Windows MinGW Environment
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Build tools
        shell: bash
        run: |
            if [ "$RUNNER_OS" == "Windows" ]; then
              export CC=gcc
              export CXX=g++
            fi
            bash build-tools.sh

      - name: Build runtime
        shell: bash
        run: |
            if [ "$RUNNER_OS" == "Windows" ]; then
              export CC=gcc
              export CXX=g++
            fi
            bash build-runtime.sh

      - name: Compress Artifacts
        id: compress
        shell: bash
        run: bash compress.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
              ${{ steps.compress.outputs.tools_archive_name }}
              ${{ steps.compress.outputs.runtime_archive_name }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.LLVM_VERSION }}"
          name: "${{ env.LLVM_VERSION }}"
          files: artifacts/*
          make_latest: true
